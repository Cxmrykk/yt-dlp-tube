<div class="add-form">
    <h3>Layout</h3>
    <form action="/settings/interface" method="POST">
        <input type="hidden" name="action" value="update_settings">

        <label class="field-label" for="set-per-page">Videos Loaded Per Scroll Page:</label>
        <input type="number" id="set-per-page" name="per_page" value="{{ app_settings.per_page }}" min="1" max="50" required>

        <label class="field-label" for="set-desc-height">Description Preview Height (px):</label>
        <input type="number" id="set-desc-height" name="desc_preview_height" value="{{ app_settings.desc_preview_height | default(100) }}" min="40" max="1000" required>
        <p class="form-help">How much of a video's description is visible before it has to be expanded.</p>

        <button type="submit" class="btn btn-danger">Save Interface Settings</button>
    </form>
</div>
