{% set current_path = request.path %}
<aside class="sidebar" id="sidebar">
    <a href="/" class="{{ 'active' if current_path == '/' }}">
        <svg class="ic nav-icon" aria-hidden="true"><use href="#ic-home"></use></svg>
        <span class="nav-label">Home Feed</span>
    </a>
    <a href="/history" class="{{ 'active' if current_path == '/history' }}">
        <svg class="ic nav-icon" aria-hidden="true"><use href="#ic-history"></use></svg>
        <span class="nav-label">History</span>
    </a>
    <a href="/fetch" class="{{ 'active' if current_path == '/fetch' }}">
        <svg class="ic nav-icon" aria-hidden="true"><use href="#ic-download"></use></svg>
        <span class="nav-label">Fetch URL</span>
    </a>
    <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
    <h3>Settings</h3>

    {% for cat in settings_categories %}
    <a href="/settings/{{ cat.id }}" class="{{ 'active' if current_path == ('/settings/' ~ cat.id) }}" title="{{ cat.description }}">
        <svg class="ic nav-icon" aria-hidden="true"><use href="#ic-{{ cat.icon }}"></use></svg>
        <span class="nav-label">{{ cat.label }}</span>
        {% if cat.id == 'subscriptions' and subs_new %}
        <span class="nav-dot" title="{{ subs_new | length }} channel{{ 's' if subs_new | length != 1 }} with new uploads"></span>
        {% endif %}
    </a>
    {% endfor %}
</aside>
