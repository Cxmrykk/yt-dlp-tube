{% extends 'base.html' %}

{% block content %}
<style>
.channel-tabs {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid #333;
    margin-bottom: 20px;
    overflow-x: auto;
    scrollbar-width: none; 
}
.channel-tabs::-webkit-scrollbar {
    display: none; 
}
.ch-tab {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    padding-bottom: 10px;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
}
.ch-tab:hover {
    color: white;
}
.ch-tab.active {
    color: white;
    border-bottom-color: var(--text-color);
}
</style>

<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; background: var(--card-bg); padding: 30px; border-radius: 12px; flex-wrap: wrap; gap: 15px;">
    <div style="display: flex; align-items: center; gap: 20px;">
        <div id="ch-icon-wrap">
            <div id="ch-icon-skel" class="skeleton-box skel-circle" style="width: 100px; height: 100px; {{ 'display:none;' if not needs_fetch else '' }}"></div>
            <img id="ch-icon" src="{{ (channel_icon | proxy_image) if channel_icon else '' }}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: #333; {{ 'display:none;' if needs_fetch else '' }}">
        </div>
        <div>
            <h1 id="ch-name" class="{{ 'skeleton-box skel-line' if needs_fetch else '' }}" style="margin: 0 0 5px 0; {{ 'width: 250px; height: 2rem;' if needs_fetch else '' }}">{{ channel_name if not needs_fetch else '' }}</h1>
            <div style="display: flex; gap: 15px; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 5px;">
                <span id="ch-subs" class="{{ 'skeleton-box skel-line' if needs_fetch else '' }}" style="{{ 'width: 120px;' if needs_fetch else '' }}"></span>
                <span id="ch-url-span">{{ url }}</span>
            </div>
        </div>
    </div>
    <button id="sub-btn" class="btn" style="display: none;" onclick="window.toggleSubscribe()">Subscribe</button>
</div>

<div class="channel-tabs" id="channelTabs">
    <a href="javascript:void(0)" class="ch-tab {% if tab == 'videos' %}active{% endif %}" data-tab="videos">Videos</a>
    <a href="javascript:void(0)" class="ch-tab {% if tab == 'shorts' %}active{% endif %}" data-tab="shorts">Shorts</a>
    <a href="javascript:void(0)" class="ch-tab {% if tab == 'streams' %}active{% endif %}" data-tab="streams">Live</a>
    <a href="javascript:void(0)" class="ch-tab {% if tab == 'releases' %}active{% endif %}" data-tab="releases">Releases</a>
    <a href="javascript:void(0)" class="ch-tab {% if tab == 'podcasts' %}active{% endif %}" data-tab="podcasts">Podcasts</a>
</div>

<div class="video-grid" id="video-grid">
    <div class="video-card" id="sentinel-card" style="opacity: 0; pointer-events: none; transition: opacity 0.3s ease;">
        <div class="thumbnail skeleton-box"></div>
        <div class="video-info">
            <div class="skel-line skeleton-box title"></div>
            <div class="skel-row">
                <div class="channel-avatar skeleton-box skel-circle"></div>
                <div class="skel-col">
                    <div class="skel-line skeleton-box"></div>
                    <div class="skel-line skeleton-box short"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.CHANNEL_CONFIG = {
        url: "{{ url | safe }}",
        tab: "{{ tab }}",
        name: "{{ channel_name | safe }}",
        icon: "{{ channel_icon | safe }}",
        isSubbed: {{ 'true' if is_subbed else 'false' }},
        needsFetch: {{ 'true' if needs_fetch else 'false' }}
    };
    window.FEED_CONFIG = {
        type: "channel",
        query: "{{ url | safe }}",
        tab: "{{ tab }}"
    };
</script>
<script src="/static/js/pages/channel.js"></script>
<script src="/static/js/pages/feed.js"></script>
{% endblock %}
