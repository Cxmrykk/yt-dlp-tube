{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="/static/css/pages/fetch.css">

<div class="fetch-dashboard">
    <div class="fetch-header-card">
        <h2 style="margin-top: 0;">Direct URL Download</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px;">
            Queue standalone media from almost any site supported by yt-dlp. Downloads run in the background and are automatically deleted after 10 minutes.
        </p>

        <form id="fetchForm" data-no-pjax="true" onsubmit="return handleFetchSubmit(event)">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="url" id="fetchUrl" placeholder="https://..." required autofocus style="flex: 1; min-width: 250px;">
                <button type="submit" id="fetchAnalyzeBtn" class="btn btn-danger" style="padding: 12px 24px;">Analyze URL</button>
            </div>
            
            <div class="proxy-toggle" onclick="document.getElementById('proxyContainer').classList.toggle('open')">
                <svg class="ic" aria-hidden="true"><use href="#ic-settings"></use></svg> Advanced Proxy Settings
            </div>
            <div id="proxyContainer" class="proxy-container">
                <label style="display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px;">Proxy Mode for this Download:</label>
                <select id="fetchProxyMode" class="format-dropdown" style="margin-bottom: 10px;" data-saved="{{ app_settings.ydl_proxy_url | default('') }}" onchange="document.getElementById('customProxyWrap').style.display = this.value === 'custom' ? 'block' : 'none'">
                    <option value="global" {% if app_settings.fetch_proxy_mode == 'global' or not app_settings.fetch_proxy_mode %}selected{% endif %}>
                        Use Global App Settings 
                        {% if app_settings.ydl_proxy_type != 'none' and app_settings.ydl_proxy_url %}
                            (Active: {{ app_settings.ydl_proxy_url }})
                        {% else %}
                            (Active: Direct Connection)
                        {% endif %}
                    </option>
                    {% if app_settings.ydl_proxy_url %}
                    <option value="saved" {% if app_settings.fetch_proxy_mode == 'saved' %}selected{% endif %}>Force Saved Proxy ({{ app_settings.ydl_proxy_url }})</option>
                    {% endif %}
                    <option value="none" {% if app_settings.fetch_proxy_mode == 'none' %}selected{% endif %}>Force Direct Connection (No Proxy)</option>
                    <option value="custom" {% if app_settings.fetch_proxy_mode == 'custom' %}selected{% endif %}>Custom SOCKS5/HTTP Proxy...</option>
                </select>
                <div id="customProxyWrap" style="display: {{ 'block' if app_settings.fetch_proxy_mode == 'custom' else 'none' }};">
                    <input type="text" id="customProxy" placeholder="socks5://user:pass@127.0.0.1:1080" value="{{ app_settings.fetch_custom_proxy | default('') }}">
                </div>
            </div>
        </form>
    </div>

    <div id="fetch-queue" class="fetch-queue">
        <!-- Job cards will be injected here -->
    </div>
</div>

<template id="fetch-job-template">
    <div class="fetch-card">
        <div class="card-header">
            <span class="card-title">...</span>
            <button class="card-close" title="Dismiss">&times;</button>
        </div>
        <div class="card-body">
            
            <div class="state-analyze" style="text-align: center; padding: 20px 0;">
                <div class="loading-spinner"></div>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Analyzing URL...</p>
            </div>

            <div class="state-select" style="display: none;">
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0; margin-bottom: 10px;">Select format:</p>
                <select class="format-dropdown"></select>
                <button type="button" class="btn btn-danger btn-start-dl" style="width: 100%; margin-top: 15px;">Start Download</button>
            </div>

            <div class="state-download" style="display: none; text-align: center;">
                <div style="width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 10px; margin-top: 5px;">
                    <div class="progress-bar-inner" style="height: 100%; width: 0%; background: #4a90e2; transition: width 0.3s;"></div>
                </div>
                <p class="progress-text" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; font-weight: bold;">0%</p>
                <button type="button" class="btn btn-abort" style="width: 100%;">Abort</button>
            </div>

            <div class="state-complete" style="display: none; text-align: center;">
                <svg class="ic" style="width:36px;height:36px;color:#4aff4a;margin-bottom:10px;" aria-hidden="true"><use href="#ic-cloud-check"></use></svg>
                <p class="expiry-text" style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px;">Expires in 10:00</p>
                <button type="button" class="btn btn-danger btn-save" style="width: 100%;">
                    <svg class="ic" style="margin-right:6px;" aria-hidden="true"><use href="#ic-download"></use></svg> Save to Device
                </button>
            </div>

            <div class="state-error error" style="display: none; margin-top: 15px; font-weight: 600; font-size: 0.9rem;"></div>
            
        </div>
    </div>
</template>

<script src="/static/js/pages/fetch.js"></script>
{% endblock %}
